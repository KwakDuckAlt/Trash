<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOL 정치·경제 시뮬레이터</title>
    <style>
        :root {
            --bg-color: #0f1923;
            --card-bg: #1c2b36;
            --accent-gold: #c8aa6e;
            --text-color: #f0f6fc;
            --danger-red: #e74c3c;
            --success-green: #2ecc71;
        }
        body {
            margin: 0;
            padding: 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .stats-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--accent-gold);
        }
        .stat-item {
            font-weight: bold;
        }
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 0;
            background: var(--card-bg);
            border: 1px solid #334e68;
            color: var(--text-color);
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--accent-gold);
            color: #000;
        }
        .content-panel {
            display: none;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            min-height: 250px;
        }
        .content-panel.active {
            display: block;
        }
        button.action-btn {
            width: 100%;
            padding: 8px;
            margin: 4px 0;
            background: #243b53;
            color: white;
            border: 1px solid var(--accent-gold);
            border-radius: 4px;
            cursor: pointer;
        }
        button.action-btn:disabled {
            background: #486581;
            opacity: 0.5;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #334e68;
        }
        #log-panel {
            margin-top: 10px;
            background: #000;
            color: #00ffcc;
            font-family: monospace;
            padding: 8px;
            height: 100px;
            overflow-y: auto;
            border-radius: 5px;
            font-size: 11px;
        }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0; color:var(--accent-gold);">LOL 정치·경제 시뮬레이터</h2>
    <small>목표: 총 자산 최고치 달성하기</small>
</div>

<div class="stats-bar">
    <div class="stat-item">골드: <span id="gold" style="color:var(--accent-gold);">1000</span> G</div>
    <div class="stat-item">총 자산: <span id="total-assets">1000</span> G</div>
    <div class="stat-item">정치 지지도: <span id="approval">10</span>%</div>
    <div class="stat-item">소속 정당: <span id="party">무소속</span></div>
</div>

<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('lol')">LoL 전투</button>
    <button class="tab-btn" onclick="switchTab('stocks')">주식 시장</button>
    <button class="tab-btn" onclick="switchTab('politics')">정치 회의</button>
</div>

<!-- 1. LoL 전투 탭 -->
<div id="tab-lol" class="content-panel active">
    <h3>챔피언 스카우트 & 전투</h3>
    <div id="champion-list"></div>
    <hr>
    <button class="action-btn" onclick="playMatch()">소환사의 협곡 경기 출전 (100G 소모)</button>
</div>

<!-- 2. 주식 시장 탭 -->
<div id="tab-stocks" class="content-panel">
    <h3>런테라 주식 시장</h3>
    <div id="stock-list"></div>
    <button class="action-btn" style="margin-top:10px;" onclick="nextTurn()">다음 턴 (시장/정치 갱신)</button>
</div>

<!-- 3. 정치 회의 탭 -->
<div id="tab-politics" class="content-panel">
    <h3>의회 및 법률 개정</h3>
    <p>지지도 상승 시 법안 통과 확률 증가</p>
    <button class="action-btn" onclick="campaign()">선거 운동하기 (200G 소모)</button>
    <button class="action-btn" onclick="passLaw('tax')">기업세 감면안 발의 (지지도 20% 필요)</button>
    <button class="action-btn" onclick="passLaw('subsidy')">e스포츠 지원금 법안 통과 (지지도 40% 필요)</button>
</div>

<div id="log-panel">게임이 시작되었습니다. 챔피언을 고용하고 자산을 늘리세요!</div>

<script>
    // 게임 상태 변수
    let state = {
        gold: 1000,
        approval: 10,
        party: '무소속',
        champions: [
            { name: '페이커의 아지르', cost: 500, power: 80, owned: false },
            { name: '캡스의 려블랑', cost: 300, power: 50, owned: false },
            { name: '루키의 제드', cost: 200, power: 30, owned: false }
        ],
        stocks: [
            { name: '자운 공업', price: 100, shares: 0 },
            { name: '필토버 은행', price: 500, shares: 0 },
            { name: '녹서스 군수산업', price: 250, shares: 0 }
        ],
        taxCut: false,
        subsidy: false
    };

    function log(msg) {
        const logBox = document.getElementById('log-panel');
        logBox.innerHTML += `<div>> ${msg}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    function updateUI() {
        // 총 자산 계산 = 골드 + (주식 보유수 * 현재가)
        let stockValue = state.stocks.reduce((acc, s) => acc + (s.price * s.shares), 0);
        let total = state.gold + stockValue;

        document.getElementById('gold').innerText = state.gold.toLocaleString();
        document.getElementById('total-assets').innerText = total.toLocaleString();
        document.getElementById('approval').innerText = state.approval;
        document.getElementById('party').innerText = state.party;

        // 챔피언 목록 갱신
        let champHTML = '';
        state.champions.forEach((c, index) => {
            champHTML += `<div class="list-item">
                <span>${c.name} (전투력: ${c.power})</span>
                ${c.owned 
                    ? '<span style="color:var(--success-green)">영입됨</span>' 
                    : `<button onclick="buyChampion(${index})">${c.cost}G 영입</button>`}
            </div>`;
        });
        document.getElementById('champion-list').innerHTML = champHTML;

        // 주식 목록 갱신
        let stockHTML = '';
        state.stocks.forEach((s, index) => {
            stockHTML += `<div class="list-item">
                <div>
                    <strong>${s.name}</strong><br>
                    <small>가가: ${s.price}G | 보유: ${s.shares}주</small>
                </div>
                <div>
                    <button onclick="buyStock(${index})">매수</button>
                    <button onclick="sellStock(${index})">매도</button>
                </div>
            </div>`;
        });
        document.getElementById('stock-list').innerHTML = stockHTML;
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById(`tab-${tabName}`).classList.add('active');
    }

    function buyChampion(index) {
        let c = state.champions[index];
        if (state.gold >= c.cost) {
            state.gold -= c.cost;
            c.owned = true;
            log(`${c.name} 챔피언을 팀에 영입했습니다!`);
            updateUI();
        } else {
            log('골드가 부족합니다.');
        }
    }

    function playMatch() {
        if (state.gold < 100) { log('참가비(100G)가 부족합니다.'); return; }
        
        let ownedChamps = state.champions.filter(c => c.owned);
        if (ownedChamps.length === 0) { log('출전시킬 영입된 챔피언이 없습니다.'); return; }

        state.gold -= 100;
        let totalPower = ownedChamps.reduce((acc, c) => acc + c.power, 0);
        let winChance = Math.min(80, totalPower / 2);
        
        if (Math.random() * 100 < winChance) {
            let reward = 300 + (state.subsidy ? 200 : 0);
            state.gold += reward;
            state.approval = Math.min(100, state.approval + 5);
            log(`승리! 상금 ${reward}G 획득 및 지지도 5% 증가.`);
        } else {
            log('패배... 상금을 얻지 못했습니다.');
        }
        updateUI();
    }

    function buyStock(index) {
        let s = state.stocks[index];
        if (state.gold >= s.price) {
            state.gold -= s.price;
            s.shares++;
            log(`${s.name} 1주 매수 완료.`);
            updateUI();
        } else {
            log('골드가 부족합니다.');
        }
    }

    function sellStock(index) {
        let s = state.stocks[index];
        if (s.shares > 0) {
            state.gold += s.price;
            s.shares--;
            log(`${s.name} 1주 매도 완료.`);
            updateUI();
        }
    }

    function nextTurn() {
        // 주가 변동
        state.stocks.forEach(s => {
            let changePercent = (Math.random() * 0.4) - 0.18; // -18% ~ +22% 변동
            if (state.taxCut) changePercent += 0.05; // 감면 시 상승 우세
            s.price = Math.max(10, Math.round(s.price * (1 + changePercent)));
        });
        log('새로운 턴: 주식 시장 가격이 변동되었습니다.');
        updateUI();
    }

    function campaign() {
        if (state.gold >= 200) {
            state.gold -= 200;
            let gain = Math.floor(Math.random() * 10) + 5;
            state.approval = Math.min(100, state.approval + gain);
            if(state.approval >= 50) state.party = '여당 (자유연합)';
            log(`선거 운동 성공! 지지도 ${gain}% 상승.`);
            updateUI();
        } else {
            log('선거 자금(200G)이 부족합니다.');
        }
    }

    function passLaw(type) {
        if (type === 'tax') {
            if (state.approval >= 20 && !state.taxCut) {
                state.taxCut = true;
                log('기업세 감면안 통과! 주식 시장 변동성이 긍정적으로 전환됩니다.');
            } else {
                log('지지도가 부족하거나 이미 통과된 법안입니다.');
            }
        } else if (type === 'subsidy') {
            if (state.approval >= 40 && !state.subsidy) {
                state.subsidy = true;
                log('e스포츠 지원금 법안 통과! 경기 승리 수당이 크게 증가합니다.');
            } else {
                log('지지도가 부족하거나 이미 통과된 법안입니다.');
            }
        }
        updateUI();
    }

    // 초기화
    updateUI();
</script>
</body>
</html>
